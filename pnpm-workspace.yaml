packages:
  - .

# Hoisted, because the DSH peers must resolve to the SAME module instances
# the host uses; a nested layout would give the plugin its own copy of e.g.
# @deepseek-ai/cordis and break service-registration identity.
nodeLinker: hoisted

# DSH packages declare each other as peers and the host supplies them.
# Installing peers automatically would pull a second, disagreeing copy.
autoInstallPeers: false

# Build-script decisions, stated explicitly. pnpm 11 treats an undecided
# dependency build as a hard error (strictDepBuilds), and its own placeholder
# for "undecided" is the literal string "set this to true or false" — so
# leaving the key absent lets pnpm rewrite this file with that sentinel and
# keep failing. Every one of these is `false` on purpose:
#
#   node-pty, koffi
#     reachable only through subprocess-local's TERMINAL path, which this
#     plugin does not cover (persistent terminals are out of scope) and the
#     suite never exercises.
#   esbuild
#     vitest bundles its own; the postinstall only verifies a binary the
#     platform-specific package already ships.
#   @deepseek-ai/dsh-subprocess-local
#     its install hook is not needed for the ordinary-command path the tests
#     use.
#
# Flip one to `true` only if you add a test that genuinely needs its
# postinstall to run.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  esbuild: false
  koffi: false
  node-pty: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.0-rc.2'
  - '@deepseek-ai/dsh-bash-local@0.2.0-rc.2'
  - '@deepseek-ai/dsh-brand@0.2.0-rc.2'
  - '@deepseek-ai/dsh-home-paths@0.2.0-rc.2'
  - '@deepseek-ai/dsh-http-proxy@0.2.0-rc.2'
  - '@deepseek-ai/dsh-jobs-local@0.2.0-rc.2'
  - '@deepseek-ai/dsh-jobs@0.2.0-rc.2'
  - '@deepseek-ai/dsh-lazy-require@0.2.0-rc.2'
  - '@deepseek-ai/dsh-llm@0.2.0-rc.2'
  - '@deepseek-ai/dsh-output-retention@0.2.0-rc.2'
  - '@deepseek-ai/dsh-sandbox@0.2.0-rc.2'
  - '@deepseek-ai/dsh-scope@0.2.0-rc.2'
  - '@deepseek-ai/dsh-session-projection@0.2.0-rc.2'
  - '@deepseek-ai/dsh-session@0.2.0-rc.2'
  - '@deepseek-ai/dsh-shell-env@0.2.0-rc.2'
  - '@deepseek-ai/dsh-shell@0.2.0-rc.2'
  - '@deepseek-ai/dsh-subprocess-local@0.2.0-rc.2'
  - '@deepseek-ai/dsh-subprocess@0.2.0-rc.2'
  - '@deepseek-ai/dsh-system-prompt@0.2.0-rc.2'
  - '@deepseek-ai/dsh-timeout@0.2.0-rc.2'
  - '@deepseek-ai/dsh-tool-bash@0.2.0-rc.2'
  - '@deepseek-ai/dsh-tools@0.2.0-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.0-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.0-rc.2'
  - '@deepseek-ai/dsh-util-values@0.2.0-rc.2'
  - '@deepseek-ai/dsh-win32-process@0.2.0-rc.2'
